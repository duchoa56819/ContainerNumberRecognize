<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ContainerLens Mobile Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #22c55e;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Camera Viewport */
        .camera-container {
            position: relative;
            flex: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Reticle overlay */
        .reticle-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .target-box {
            width: 82%;
            height: 38%;
            border: 2px dashed rgba(56, 189, 248, 0.8);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
        }

        .target-box::before, .target-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #38bdf8;
            border-style: solid;
        }

        .target-box::before {
            top: -2px; left: -2px;
            border-width: 4px 0 0 4px;
            border-top-left-radius: 10px;
        }

        .target-box::after {
            bottom: -2px; right: -2px;
            border-width: 0 4px 4px 0;
            border-bottom-right-radius: 10px;
        }

        .scan-line {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            box-shadow: 0 0 8px #38bdf8;
            animation: scan 2.5s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 5%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .target-hint {
            margin-top: 18px;
            background: rgba(15, 23, 42, 0.75);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Bottom Controls */
        .controls {
            background: rgba(15, 23, 42, 0.95);
            padding: 18px 20px 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }

        .action-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-btn:active {
            transform: scale(0.92);
            background: #e2e8f0;
        }

        .shutter-inner {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #0284c7;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .fallback-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
        }

        /* Result Bottom Sheet */
        .result-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            border-top: 2px solid #38bdf8;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
            max-height: 80vh;
            overflow-y: auto;
        }

        .result-sheet.open {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #64748b;
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .code-title {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-display {
            font-size: 1.8rem;
            font-family: monospace;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin: 4px 0 10px 0;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-valid { background: #166534; color: #4ade80; border: 1px solid #22c55e; }
        .badge-repaired { background: #854d0e; color: #fde047; border: 1px solid #eab308; }
        .badge-invalid { background: #991b1b; color: #fca5a5; border: 1px solid #ef4444; }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-item-lbl { font-size: 0.75rem; color: #94a3b8; }
        .meta-item-val { font-size: 0.95rem; font-weight: 600; color: #f8fafc; margin-top: 2px; }

        .sheet-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-primary {
            flex: 1;
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            color: #f8fafc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span>🚢</span>
            <span>ContainerLens Mobile</span>
            <span class="status-dot" id="netStatus"></span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="flipCamBtn">🔄 Flip</button>
        </div>
    </header>

    <div class="camera-container">
        <video id="videoElement" autoplay playsinline muted></video>
        <div class="reticle-container">
            <div class="target-box">
                <div class="scan-line"></div>
            </div>
            <div class="target-hint">Align Container Number in Frame</div>
        </div>
    </div>

    <div class="controls">
        <div class="action-row">
            <label class="toggle-label">
                <input type="checkbox" id="autoScanToggle"> Auto-Scan (1.5s)
            </label>

            <button class="shutter-btn" id="shutterBtn" title="Take Snapshot">
                <div class="shutter-inner"></div>
            </button>

            <label class="fallback-btn" for="fileInput">
                📁 Native Camera
            </label>
            <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;">
        </div>
    </div>

    <!-- Result Bottom Sheet -->
    <div class="result-sheet" id="resultSheet">
        <div class="sheet-handle" onclick="closeSheet()"></div>
        <div class="code-title">Identified Container</div>
        <div class="code-display" id="resCode">CSLU 144226 [8]</div>
        <div id="resBadge"><span class="badge badge-valid">✓ ISO 6346 VALID</span></div>

        <div class="meta-grid">
            <div>
                <div class="meta-item-lbl">CARRIER / OPERATOR</div>
                <div class="meta-item-val" id="resOwner">China Shipping</div>
            </div>
            <div>
                <div class="meta-item-lbl">TYPE / SIZE</div>
                <div class="meta-item-val" id="resType">22G1 (20ft Dry)</div>
            </div>
            <div>
                <div class="meta-item-lbl">CHECK DIGIT</div>
                <div class="meta-item-val" id="resCheck">8 (Calculated: 8)</div>
            </div>
            <div>
                <div class="meta-item-lbl">PROCESSING TIME</div>
                <div class="meta-item-val" id="resTime">920 ms</div>
            </div>
        </div>

        <div class="sheet-btn-row">
            <button class="btn-primary" onclick="closeSheet()">Scan Next</button>
            <button class="btn-secondary" onclick="copyCode()">📋 Copy</button>
        </div>
    </div>

    <div class="toast" id="toastMsg">Container Copied!</div>

    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('hiddenCanvas');
        const shutterBtn = document.getElementById('shutterBtn');
        const autoScanToggle = document.getElementById('autoScanToggle');
        const resultSheet = document.getElementById('resultSheet');
        const flipCamBtn = document.getElementById('flipCamBtn');
        const fileInput = document.getElementById('fileInput');

        let currentStream = null;
        let useFrontCamera = false;
        let isProcessing = false;
        let autoScanTimer = null;
        let lastScannedCode = "";

        // Web Audio synthetic success beep
        function playBeep(freq = 880, duration = 0.15) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate([80, 40, 80]);
            }
        }

        // Initialize Camera
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                console.warn("Camera streaming error:", err);
                showToast("Live camera not available. Use Native Camera button.");
            }
        }

        flipCamBtn.onclick = () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        };

        // Capture Frame from Video
        function captureFrameBlob() {
            return new Promise((resolve) => {
                if (!video.videoWidth) {
                    resolve(null);
                    return;
                }
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.88);
            });
        }

        // Send Frame to Recognition Backend
        async function processBlob(blob) {
            if (!blob || isProcessing) return;
            isProcessing = true;
            shutterBtn.style.opacity = '0.5';

            const formData = new FormData();
            formData.append('file', blob, 'capture.jpg');
            formData.append('confidence', '0.20');
            formData.append('use_detector', 'true');
            formData.append('padding', '0.08');

            try {
                const res = await fetch('/api/v1/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                handlePredictionResult(data);
            } catch (err) {
                console.error("Inference request failed:", err);
            } finally {
                isProcessing = false;
                shutterBtn.style.opacity = '1.0';
            }
        }

        function handlePredictionResult(data) {
            const code = data.container_number;
            if (!code || code === "Not Found") {
                if (!autoScanToggle.checked) {
                    showToast("No container code detected. Try closer.");
                }
                return;
            }

            if (autoScanToggle.checked && code === lastScannedCode && resultSheet.classList.contains('open')) {
                return;
            }

            lastScannedCode = code;
            playBeep(980, 0.18);
            triggerHaptic();

            document.getElementById('resCode').textContent = data.formatted_number || code;
            document.getElementById('resOwner').textContent = data.owner_name || data.owner_code || "Unknown";
            document.getElementById('resType').textContent = (data.size_type_code ? data.size_type_code + " - " : "") + (data.size_type_desc || "Standard");
            document.getElementById('resCheck').textContent = `${data.check_digit} (Expected: ${data.expected_check_digit})`;
            document.getElementById('resTime').textContent = `${data.elapsed_time_ms} ms`;

            const badgeBox = document.getElementById('resBadge');
            if (data.is_valid && !data.repaired) {
                badgeBox.innerHTML = '<span class="badge badge-valid">✓ ISO 6346 VALID</span>';
            } else if (data.is_valid && data.repaired) {
                badgeBox.innerHTML = '<span class="badge badge-repaired">⚡ AUTO-CORRECTED</span>';
            } else {
                badgeBox.innerHTML = '<span class="badge badge-invalid">✕ CHECK DIGIT MISMATCH</span>';
            }

            resultSheet.classList.add('open');
        }

        function closeSheet() {
            resultSheet.classList.remove('open');
        }

        function copyCode() {
            const code = document.getElementById('resCode').textContent.replace(/[^A-Za-z0-9]/g, '');
            navigator.clipboard.writeText(code);
            showToast("Copied: " + code);
        }

        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        // Shutter Click Handler
        shutterBtn.onclick = async () => {
            const blob = await captureFrameBlob();
            if (blob) {
                await processBlob(blob);
            }
        };

        // Native Camera Fallback (file input with capture="environment")
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                processBlob(file);
            }
        };

        // Auto Scan Toggle
        autoScanToggle.onchange = () => {
            if (autoScanToggle.checked) {
                autoScanTimer = setInterval(async () => {
                    if (!isProcessing && !resultSheet.classList.contains('open')) {
                        const blob = await captureFrameBlob();
                        if (blob) {
                            await processBlob(blob);
                        }
                    }
                }, 1500);
            } else {
                if (autoScanTimer) clearInterval(autoScanTimer);
            }
        };

        // Start on load
        window.addEventListener('load', () => {
            startCamera();
        });
    </script>
</body>
</html>
